name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish dist to cf-live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STAGE=$(mktemp -d)
          cp -a dist/. "$STAGE/"
          cd "$STAGE"
          git init
          git checkout -b cf-live
          git add -A
          git commit -m "Publish landing assets from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin cf-live
      - name: Wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3c3fe681053affe566cb197e28892790"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "cf-live is the live origin. Set CLOUDFLARE_API_TOKEN to also run wrangler deploy."
            exit 0
          fi
          npx --yes wrangler deploy
