name = "quodex-windows-website"
main = "worker.js"
compatibility_date = "2026-09-11"
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[[routes]]
pattern = "quodex.app/windows*"
zone_name = "quodex.app"

[observability]
enabled = true

[build]
command = "npm ci && npm test && npm run build"
