name = "quodex-windows-website"
main = "worker.js"
compatibility_date = "2026-09-11"
account_id = "3c3fe681053affe566cb197e28892790"
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = true

[[routes]]
pattern = "quodex.app/windows*"
zone_name = "quodex.app"

[[routes]]
pattern = "quodex.app/.well-known/security.txt"
zone_name = "quodex.app"

[[routes]]
pattern = "quodex.app/security.txt"
zone_name = "quodex.app"

[[routes]]
pattern = "quodex.app/llms.txt"
zone_name = "quodex.app"

[[routes]]
pattern = "quodex.app/llm.txt"
zone_name = "quodex.app"

[[routes]]
pattern = "quodex.app/humans.txt"
zone_name = "quodex.app"

[[routes]]
pattern = "quodex.app/sitemap.xml"
zone_name = "quodex.app"

[observability]
enabled = true

[build]
command = "npm ci && npm test && npm run build"
